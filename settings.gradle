pluginManagement {
    repositories {
        maven { url = 'https://maven.fabricmc.net/' }
        maven { url = 'https://maven.architectury.dev/' }
        maven { url = 'https://maven.neoforged.net/releases/' }
        gradlePluginPortal()
    }
}

plugins {
    // Downloads the JDKs the modules ask for (21 for Minecraft 1.21.1 and the core, 25 for 26.3).
    id 'org.gradle.toolchains.foojay-resolver-convention' version '1.0.0'
}

rootProject.name = 'BlockCompanion'

// Plain Java 21 logic shared by every platform: schematic IO, transforms, layers, compare, item counting.
include 'core'
// Bukkit-API plugin for Paper/Spigot/Bukkit servers.
include 'paper'
// Minecraft 1.21.1, 26.2 and 26.3: Architectury multiloader (common + Fabric + NeoForge).
include 'mc-1.21.1:common', 'mc-1.21.1:fabric', 'mc-1.21.1:neoforge'
include 'mc-26.2:common', 'mc-26.2:fabric', 'mc-26.2:neoforge'
include 'mc-26.3:common', 'mc-26.3:fabric', 'mc-26.3:neoforge'
