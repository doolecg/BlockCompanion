// Minecraft 26.2: shared setup for common, fabric and neoforge. The game ships unobfuscated, so Architectury Loom runs
// without mappings or remapping and the shaded jar is the mod jar.
subprojects {
    apply plugin: 'dev.architectury.loom-no-remap'
    apply plugin: 'architectury-plugin'

    architectury {
        minecraft = project.minecraft_version
    }

    base {
        archivesName = "${rootProject.archives_name}-${project.name}-${project.minecraft_version}"
    }

    dependencies {
        minecraft "net.minecraft:minecraft:${project.minecraft_version}"
    }

    java {
        toolchain.languageVersion = JavaLanguageVersion.of(project.java_version as int)
        withSourcesJar()
    }

    tasks.withType(JavaCompile).configureEach {
        options.encoding = 'UTF-8'
        options.release = project.java_version as int
    }
}
