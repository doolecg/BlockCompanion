// Plain Java 21, no Minecraft classes. The mc-* common modules compile these sources in, so every mod jar carries them.
plugins {
    id 'java-library'
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(21)
    withSourcesJar()
}

base {
    archivesName = 'blockcompanion-core'
}

repositories {
    mavenCentral()
}

dependencies {
    testImplementation platform('org.junit:junit-bom:5.11.4')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testImplementation 'org.assertj:assertj-core:3.27.3'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 21
}

test {
    useJUnitPlatform()
    // Real schematics from the BlockDesigner repository, when it sits next to this one.
    systemProperty 'blockcompanion.testdata', rootProject.file('../BlockDesigner/testdata').absolutePath
}
