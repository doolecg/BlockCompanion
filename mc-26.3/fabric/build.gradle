plugins {
    id 'com.gradleup.shadow'
}

architectury {
    platformSetupLoomIde()
    fabric()
}

// Readable names for the IDE run configs Loom generates.
loom {
    runs {
        client {
            configName = '26.3 Fabric Client'
        }
        server {
            configName = '26.3 Fabric Server'
        }
    }
}

configurations {
    common {
        canBeResolved = true
        canBeConsumed = false
    }
    compileClasspath.extendsFrom common
    runtimeClasspath.extendsFrom common
    developmentFabric.extendsFrom common

    // Bundled into the mod jar by Shadow.
    shadowBundle {
        canBeResolved = true
        canBeConsumed = false
    }
}

repositories {
    // Mod Menu, for the settings button in its mod list (optional at runtime).
    maven { url = 'https://maven.terraformersmc.com/releases/' }
}

dependencies {
    implementation "net.fabricmc:fabric-loader:${project.fabric_loader_version}"
    implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
    compileOnly "com.terraformersmc:modmenu:${project.modmenu_version}"

    common(project(path: ':mc-26.3:common')) { transitive = false }
    shadowBundle project(path: ':mc-26.3:common', configuration: 'transformProductionFabric')
}

processResources {
    inputs.property 'version', project.version
    filesMatching('fabric.mod.json') {
        expand version: inputs.properties.version
    }
}

// Minecraft is not obfuscated on this version, so there is no remapJar task: the shaded jar is the mod jar.
jar {
    archiveClassifier = 'dev'
}

shadowJar {
    configurations = [project.configurations.shadowBundle]
    archiveClassifier = null
}

assemble.dependsOn shadowJar

configurations {
    apiElements {
        outgoing.artifacts.clear()
        outgoing.artifact(shadowJar)
    }
    runtimeElements {
        outgoing.artifacts.clear()
        outgoing.artifact(shadowJar)
    }
}
